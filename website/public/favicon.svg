<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">PFGAP documentation</title>
  <desc id="description">A blue and violet rounded square containing the letters PF.</desc>

  <defs>
    <linearGradient
      id="background"
      x1="8"
      y1="6"
      x2="56"
      y2="58"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.62" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient
      id="highlight"
